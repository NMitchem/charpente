[package]
name = "charpente"
description = "The load-bearing frame for the whole backend: tables, routes, jobs, events, HTTP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

# GUIDE's ```rust blocks compile in guide-examples; rustdoc must not also run them.
[lib]
doctest = false

[dependencies]
charpente-core.workspace = true
charpente-macros.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "net", "sync"] }
sha2 = { version = "0.10", features = ["oid"] }
base64ct = { version = "1", features = ["alloc"] }
rsa = "0.9"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.9"
tower-service = "0.3.3"

[lints]
workspace = true

[dev-dependencies]
charpente-sim.workspace = true
