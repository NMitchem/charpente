[package]
name = "charpente"
description = "The load-bearing frame for the whole backend: tables, routes, jobs, events, HTTP."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
charpente-core.workspace = true
charpente-macros.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "net", "sync"] }
sha2 = { version = "0.10", features = ["oid"] }
base64ct = { version = "1", features = ["alloc"] }
rsa = "0.9"

[lints]
workspace = true

[dev-dependencies]
charpente-sim = { path = "../charpente-sim" }
