[package]
name = "charpente-cli"
description = "The charpente CLI: test --sim, describe, serve."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[[bin]]
name = "charpente"
path = "src/main.rs"

[dependencies]
charpente.workspace = true
# gen-client/check-client: the emitter, and the two halves of reading one
# app's contract back off its stdout. serde/serde_json do no IO, no
# threading and no time of their own, and charpente already depends on both
# — this crate names them directly because it deserializes a contract into
# its own owned mirror (src/genclient.rs), which charpente does not.
charpente-tsgen = { path = "../charpente-tsgen", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
