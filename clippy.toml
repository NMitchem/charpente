# The mechanical fence around the deterministic core (CLAUDE.md hard rule 1,
# DESIGN.md §1): no ambient time, randomness, filesystem, network, or thread
# spawning anywhere in the workspace. All IO goes through the Clock/Entropy/
# Disk/Net traits. Production trait impls are the one sanctioned boundary and
# opt out site-locally with #[allow(clippy::disallowed_methods)] plus a
# rationale comment.
#
# Entries for tokio/rand/etc. are added in the same commit that adds the
# dependency.

disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "ambient wall clock — use the Clock trait (DESIGN.md §1)" },
    { path = "std::time::Instant::now", reason = "ambient monotonic clock — use the Clock trait (DESIGN.md §1)" },
    { path = "std::thread::sleep", reason = "ambient time — use Clock::sleep (DESIGN.md §1)" },
    { path = "std::thread::spawn", reason = "ambient task spawning — scheduling goes through the deterministic executor (DESIGN.md §1)" },
    { path = "std::thread::scope", reason = "ambient task spawning — scheduling goes through the deterministic executor (DESIGN.md §1)" },
    { path = "std::thread::Scope::spawn", reason = "ambient task spawning — scheduling goes through the deterministic executor (DESIGN.md §1)" },
    { path = "std::fs::read", reason = "ambient filesystem — use the Disk trait (DESIGN.md §1)" },
    { path = "std::fs::read_to_string", reason = "ambient filesystem — use the Disk trait (DESIGN.md §1)" },
    { path = "std::fs::write", reason = "ambient filesystem — use the Disk trait (DESIGN.md §1)" },
    { path = "std::fs::copy", reason = "ambient filesystem — use the Disk trait (DESIGN.md §1)" },
    { path = "std::fs::rename", reason = "ambient filesystem — use the Disk trait (DESIGN.md §1)" },
    { path = "std::fs::remove_file", reason = "ambient filesystem — use the Disk trait (DESIGN.md §1)" },
    { path = "std::fs::create_dir", reason = "ambient filesystem — use the Disk trait (DESIGN.md §1)" },
    { path = "std::fs::create_dir_all", reason = "ambient filesystem — use the Disk trait (DESIGN.md §1)" },
    { path = "std::fs::remove_dir", reason = "ambient filesystem — use the Disk trait (DESIGN.md §1)" },
    { path = "std::fs::remove_dir_all", reason = "ambient filesystem — use the Disk trait (DESIGN.md §1)" },
    { path = "std::fs::read_dir", reason = "ambient filesystem — use the Disk trait (DESIGN.md §1)" },
    { path = "std::fs::metadata", reason = "ambient filesystem — use the Disk trait (DESIGN.md §1)" },
    { path = "redb::Database::create", reason = "opens the filesystem directly, bypassing the Disk boundary — mount redb with table::Store::open (create_with_backend)" },
    { path = "redb::Database::open", reason = "opens the filesystem directly, bypassing the Disk boundary — mount redb with table::Store::open (create_with_backend)" },
    { path = "redb::Builder::create", reason = "opens the filesystem directly, bypassing the Disk boundary — mount redb with table::Store::open (create_with_backend)" },
    { path = "redb::Builder::open", reason = "opens the filesystem directly, bypassing the Disk boundary — mount redb with table::Store::open (create_with_backend)" },
    { path = "std::net::TcpStream::connect", reason = "ambient network — use the Net trait (DESIGN.md §1)" },
    { path = "std::net::TcpListener::bind", reason = "ambient network — use the Net trait (DESIGN.md §1)" },
    { path = "std::net::UdpSocket::bind", reason = "ambient network — use the Net trait (DESIGN.md §1)" },
    { path = "tokio::spawn", reason = "ambient task spawning — edge modules only; core scheduling goes through the deterministic executor (DESIGN.md §1)" },
    { path = "tokio::task::spawn_blocking", reason = "ambient task spawning — edge modules only (DESIGN.md §1)" },
    { path = "tokio::time::sleep", reason = "ambient time — use Clock::sleep (DESIGN.md §1)" },
    { path = "tokio::net::TcpListener::bind", reason = "ambient network — use the Net trait (DESIGN.md §1)" },
    { path = "tokio::net::TcpStream::connect", reason = "ambient network — use the Net trait (DESIGN.md §1)" },
    { path = "std::process::Command::new", reason = "ambient process spawning — edge tooling only (charpente-cli); nothing inside the deterministic boundary spawns processes (DESIGN.md §1)" },
    { path = "std::process::Command::spawn", reason = "ambient process spawning — edge tooling only (charpente-cli); nothing inside the deterministic boundary spawns processes (DESIGN.md §1)" },
    # The process-global panic hook is installed by exactly ONE site, the simulator's
    # `install_open_fence_hook` (charpente-sim/src/harness.rs), which filters redb's
    # benign open-fence trace (F1, 2026-09-09). A second installer anywhere — and above
    # all one inside the deterministic boundary — replaces that filter silently, and
    # can mute a genuine panic on a parallel sim worker. This was a review-enforced
    # invariant in a repo whose hard rule 1 forbids that arrangement.
    { path = "std::panic::set_hook", reason = "the process-global panic hook has one sanctioned installer, charpente-sim's install_open_fence_hook — a second one silently replaces the redb open-fence filter (F1) and can mute a real panic on another sim worker; route new hook needs through that function" },
    { path = "std::panic::take_hook", reason = "pairs with set_hook — taking the hook outside charpente-sim's install_open_fence_hook is the first half of installing a second one" },
    # rsa (auth T5, OIDC RS256 verification) pulls rand/rand_core/getrandom
    # transitively and unconditionally via num-bigint-dig's mandatory "prime"
    # feature — no combination of rsa's own feature flags disables it. The
    # shipped production paths (OidcVerifier::from_config, ::verify) only
    # construct RsaPublicKey and call .verify(), both RNG-free; test JWT
    # minting uses RsaPrivateKey::from_p_q (fixed primes) + the no-RNG .sign()
    # path. These entries fence rsa's nameable RNG-consuming surface so the
    # boundary is mechanical rather than a claim in a review doc.
    { path = "rsa::RsaPrivateKey::new", reason = "RSA keygen draws OS entropy directly — use the Entropy trait (DESIGN.md §1); production paths only construct RsaPublicKey from provisioned JWKS material" },
    { path = "rsa::RsaPrivateKey::new_with_exp", reason = "RSA keygen draws OS entropy directly — use the Entropy trait (DESIGN.md §1); production paths only construct RsaPublicKey from provisioned JWKS material" },
    { path = "rsa::RsaPrivateKey::sign_with_rng", reason = "RSA blinded signing draws OS entropy — use the Entropy trait (DESIGN.md §1); the deterministic core only verifies signatures, it never signs" },
    { path = "rsa::RsaPrivateKey::decrypt_blinded", reason = "RSA blinded decryption draws OS entropy — use the Entropy trait (DESIGN.md §1); the deterministic core has no RSA decryption path" },
    { path = "rsa::RsaPublicKey::encrypt", reason = "RSA encryption draws OS entropy for padding — use the Entropy trait (DESIGN.md §1); the deterministic core only verifies signatures, it never encrypts" },
]

disallowed-types = [
