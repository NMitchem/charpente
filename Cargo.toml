[workspace]
resolver = "3"
members = [
    "crates/charpente-core",
    "crates/charpente",
    "crates/charpente-macros",
    "crates/charpente-sim",
    "crates/charpente-cli",
    "crates/sim-fixture",
    "crates/guide-examples",
    "crates/edge-harness",
    "examples/invoicing",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
charpente-core = { path = "crates/charpente-core", version = "0.0.0" }
charpente-macros = { path = "crates/charpente-macros", version = "0.0.0" }
charpente = { path = "crates/charpente", version = "0.0.0" }

# Hard rule 1 (CLAUDE.md): ambient nondeterminism is banned mechanically, not by
# review. The deny-list itself lives in clippy.toml at the workspace root.
[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"

# The seed-replay promise is cross-build-mode (DESIGN §1): redb-4.1.0's open path
# walks pages only under debug_assertions, drawing sim IO rolls debug-only and
# skewing every downstream draw (seed 0xff159ed76d2806e4; root cause in the
# 2026-07-15 mode-skew investigation). Forcing them on in release keeps both
# modes on one stream — and keeps redb's own asserts live in production, per
# hard rule 4's assertions-stay-on ethos. Revisit when M2's engine replaces redb.
[profile.release.package.redb]
debug-assertions = true
