[workspace]
resolver = "3"
members = [
    "crates/charpente-core",
    "crates/charpente",
    "crates/charpente-macros",
    "crates/charpente-sim",
    "crates/charpente-cli",
    "crates/charpente-tsgen",
    "crates/sim-fixture",
    "crates/merge-fixture",
    "crates/outbound-fixture",
    "crates/clock-fixture",
    "crates/ts-fixture-app",
    "crates/guide-examples",
    "crates/edge-harness",
    "crates/bench-harness",
    "examples/invoicing",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NMitchem/charpente"

[workspace.dependencies]
charpente-core = { path = "crates/charpente-core", version = "0.3.0" }
charpente-macros = { path = "crates/charpente-macros", version = "0.3.0" }
charpente = { path = "crates/charpente", version = "0.3.0" }
charpente-sim = { path = "crates/charpente-sim", version = "0.3.0" }

# Hard rule 1 (CLAUDE.md): ambient nondeterminism is banned mechanically, not by
# review. The deny-list itself lives in clippy.toml at the workspace root.
[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"

# The seed-replay promise is cross-build-mode (DESIGN §1): redb's open path walks
# pages only under debug_assertions (`Database::new` -> `mark_allocated_page_for_debug`,
# in 4.1.0 and still in 4.3.0), drawing sim IO rolls debug-only and skewing every
# downstream draw (seed 0xff159ed76d2806e4; root cause in the 2026-07-15 mode-skew
# investigation). Re-proved for 4.3.0 on 2026-09-30: without this override, 7 of 7
# pinned-base batches diverge between release and debug. Forcing them on in release
# keeps both modes on one stream — and keeps redb's own asserts live in production,
# per hard rule 4's assertions-stay-on ethos. Revisit when M2's engine replaces redb.
[profile.release.package.redb]
debug-assertions = true

# Sim runtime is dominated by redb, and in an unoptimized build its zeroed-page
# allocator (`cached_file::zero_filled_arc`) fills byte-by-byte through an
# iterator instead of a memset — ~34% of a universe's CPU by profile. `opt-level`
# is orthogonal to `debug-assertions` (left on, per the override above and dev's
# default), so redb's `debug_assertions`-gated page walk still runs and still
# draws the same sim IO rolls: branch selection is unchanged, only its speed.
# The seed promise is what guards this claim, not the reasoning — the CI
# tripwire replays across both build modes.
[profile.dev.package.redb]
opt-level = 3
