name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Carries the nondeterminism deny-list (clippy.toml) — hard rule 1.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Isolates charpente-core's own feature resolution — hard rule 1's mechanical
      # enforcement for the serde dependency added in 87d209b. Cargo unifies features
      # across the whole workspace, so `cargo build/test --workspace` compiles
      # charpente-core with charpente's `serde/derive` feature turned on regardless of
      # what charpente-core's own Cargo.toml asks for: a `#[derive(Serialize)]` (or any
      # other serde/derive macro) inside the deterministic core compiles clean under
      # every command above and would ship green forever without this line. Built alone,
      # charpente-core reverts to its own manifest (no `derive` feature), so the same
      # derive fails here. Task 2 fix round 1 confirmed both directions: FAILS (101) with
      # a `#[derive(serde::Serialize)]` probe present, PASSES (0) with it removed.
      - run: cargo check -p charpente-core
      # The publish gate (spec 2026-09-13-publish-path §3): `--workspace` skips
      # `publish = false` members and then refuses a publishable crate whose dependency
      # is not in the set — which is exactly how charpente-tsgen's `publish = false`
      # was caught on 2026-09-13. `--no-verify` skips the six verify builds; the full
      # verify runs in scripts/publish.sh's dry-run, not here (metered minutes). This
      # proves the manifests, not the packaged sources.
      - run: cargo publish --workspace --dry-run --no-verify
      # `--no-fail-fast` is load-bearing: without it cargo stops at the first failing
      # package, every later suite never runs, and the log is indistinguishable from a
      # clean sweep. That blind spot hid two `replication` failures for three commits
      # (2026-09-07). The job must exercise every suite before it reports.
      - run: cargo test --workspace --no-fail-fast
      # Cross-build-mode seed replay (the mode-skew regression, seed 0xff159ed76d2806e4).
      - run: CHARPENTE_SEED=0x8bee1752811ae873 cargo test --release -p charpente-sim --test crash_recovery
      - run: CHARPENTE_SEED=0xff159ed76d2806e4 cargo test --release -p charpente --test replication -- late_follower_seeds_below_the_gcd_base_and_converges --exact
      # The kernel pin, in DEBUG — added 2026-08-14 (T9 census finding C4). Until this line
      # existed, seed 0x348270b38f166529 was enforced by local sweep convention alone: it appears
      # nowhere in .github/ or scripts/, so a change that defanged it left CI silent and only a
      # human remembering a command stood in the way. Named --exact on purpose: CHARPENTE_SEED is
      # read only by run_universes*_in, so it forces exactly ONE test in this suite (the file's
      # only run_universes_swarm!). Running the whole suite would report 30 passes of which 29 ran
      # at their own literals and are not evidence about the pin. Debug because this pin is a debug
      # replay (the two above are the release mode-skew pair), and debug artifacts are already warm
      # from `cargo test --workspace`, so the marginal cost is one test.
      - run: CHARPENTE_SEED=0x348270b38f166529 cargo test -p charpente --test kernel -- kernel_jobs_are_exactly_once_under_the_fault_matrix --exact
      # The seed that can actually FAIL if that classification regresses — added 2026-08-19.
      # The pin above no longer reaches the is_fault_fallout arm: T7's group-commit rewrite moved
      # the op schedule, and T9 re-verified on 2026-08-15 that deleting the classification leaves
      # 0x348270b38f166529 GREEN (crates/charpente/tests/kernel.rs:1388-1403). Both lines are kept
      # deliberately — the older seed still exercises Kernel::build's drain-id fix (dispatch.rs's
      # "job in the heap is not Pending" assert), while this one is the live RED-first
      # reproduction, confirmed RED with the classification deleted and GREEN with it restored.
      # Until this line existed the replacement appeared only in a source comment, which is
      # exactly the condition the block above describes: a defanged pin leaving CI silent while a
      # human remembering a command is the only thing standing in the way.
      - run: CHARPENTE_SEED=0xe653f43924f17fe8 cargo test -p charpente --test kernel -- kernel_jobs_are_exactly_once_under_the_fault_matrix --exact
      # The passthrough guard, in DEBUG with --ignored — added 2026-08-20. It is `#[ignore]`d
      # because it needs a real disk, so `cargo test --workspace` above lists it as "ignored" and
      # runs nothing: until this line existed the fix it guards was enforced by a `scripts/bench.sh
      # --smoke` convention alone, appearing nowhere in .github/ — exactly the condition the two
      # blocks above describe, and the reason both of those lines exist.
      # It has teeth, proved 2026-08-20 in an isolated worktree with its own CARGO_TARGET_DIR:
      # mutating `kernel_bench.rs`'s `let phases_counted = trace.is_recording();` fails it with
      # "a passthrough arm must publish phases: None, never a zeroed Some", every IO field 0 and
      # the whole 5.8 s window folded into lead_in. That zeroed-Some is the bug this whole
      # sub-project exists to forbid, pointed at the instrument itself.
      # Named --exact for the same reason as the pins above: --ignored alone would run every
      # ignored test in the crate, most of which are not evidence about this fix. Debug and --lib
      # because those artifacts are already warm from `cargo test --workspace`, so the marginal
      # cost is one test — 17 s locally against an 18m33s run.
      # If this proves flaky on a shared runner, tighten `known_noisy` at the test site rather
      # than deleting the line; a guard removed for noise is a guard that never fires.
      - run: cargo test -p bench-harness --lib -- kernel_bench::tests::passthrough_records_nothing_and_recording_records_something --exact --ignored

  # The TypeScript client gate (TS-codegen spec §4/§7). Three checks, each of which
  # fails for a different reason, and none of which the Rust suite above can perform.
  #
  # `check-client` is the STALENESS oracle: it rebuilds the fixture app, regenerates its
  # client, and compares against the committed file. A Rust route or wire type that
  # changed without the client being regenerated exits 1 and prints the first differing
  # line, so the log shows WHAT drifted without a generated file being dumped into it.
  # Its codes are 0 green / 1 stale-or-missing / 2 usage-or-launch fault / 101 a contract
  # the emitter refuses by name (a duplicate identifier, a shadowed transport member) —
  # the 1-vs-2 split matters, because collapsing them would tell CI a client is stale
  # when the truth is that the build broke.
  #
  # `tsc --noEmit` is the TYPE oracle, and it is what makes the whole sub-project an
  # oracle rather than a code generator. It checks the generated client against
  # hand-written call sites (`calls.ts`), against `@ts-expect-error` brand negatives that
  # fail if a wrong-id assignment COMPILES (`negatives.ts`), and against generated
  # serde-fidelity literals — real serde_json documents checked with `satisfies`, so a
  # serde rename the type IR missed is a compile error here rather than a generated type
  # that is wrong and type-checks (`generated/samples.ts`).
  #
  # `cargo test -p ts-fixture-app --test samples` is `samples.ts`'s own staleness oracle,
  # the counterpart of `check-client` for the file `gen-client` does not write. It is
  # also reached by `cargo test --workspace` in the `check` job above; it is repeated
  # here so this gate stands on its own rather than depending on another job's coverage.
  #
  # Proved to have teeth locally, per case, on 2026-08-26 (task 11 step 5): renaming a
  # field, changing a `u32` to a `String`, and adding a required field each made
  # `check-client` exit 1 naming the drifted line, and each made `tsc` exit 2 naming the
  # changed field once the client was regenerated. Rewriting the generated `CustomerId`
  # to a plain `string` turned both brand negatives into "Unused '@ts-expect-error'
  # directive". Every mutation was reverted and both gates confirmed green in between.
  # First executed on a runner 2026-08-29 (run 33272881382, commit 8acab0f): both jobs
  # green, every step. Until then this file had been written under a commit-locally,
  # do-not-push instruction, so the runner path — Node install, `npm ci` in a clean
  # checkout, working directories — had never run. It has now.
  #
  # `typescript` is pinned as a devDependency with a committed lockfile, and every
  # type-check below runs `npm run check` (which resolves to `node_modules/.bin/tsc`)
  # rather than `npx tsc`. Measured 2026-08-29, offline from the npm cache: `npx tsc`
  # resolves to the npm package literally named "tsc", a deprecated 2016 stub at
  # version 2.0.4 — not to TypeScript. It reads no source file, reports no diagnostic,
  # exits 1, and prints "This is not the tsc command you are looking for" together with
  # the fix. So the hazard is a confusing red on a machine without `node_modules`, not
  # a silent green from a nine-year-old compiler: the stub never type-checks at all.
  # Pinning settles the resolution question outright rather than depending on npx
  # preferring a local binary, which is an invariant nothing here states or enforces.
  #
  # `npm run check` is `tsc --noEmit` with no flags, so the strictness CI enforces is
  # exactly what `ts-fixture/tsconfig.json` carries — `exactOptionalPropertyTypes`
  # included (chunk B2). A flag passed on the command line here would be a flag the
  # file does not have, and `npm run test` would not inherit it.
  #
  # The CLI is built and then invoked directly rather than through `cargo run -p
  # charpente-cli --`, matching how charpente-cli's own tests invoke it
  # (`CARGO_BIN_EXE_charpente`): `check-client` shells out to `cargo build` itself, and
  # a cargo inside a cargo shares one target directory and one build lock.
  ts-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ts-fixture/package-lock.json
      - run: npm ci
        working-directory: ts-fixture
      - run: cargo build -p charpente-cli
      - run: ./target/debug/charpente check-client --dir crates/ts-fixture-app --out ts-fixture/src/generated/client.ts
      - run: cargo test -p ts-fixture-app --test samples
      - run: npm run check
        working-directory: ts-fixture
      # The RUNTIME oracle (chunk B0, ts-client-codegen): `npm run check` above can only
      # prove a call site type-checks, never that a runtime VALUE matches its declared
      # type — so it cannot catch "the declared type is `bigint` and the value is a
      # string", which is exactly how the Int64 bug (task 11 finding 1) shipped through
      # a green gate. `npm run test` compiles `src/**/*.test.ts` to a gitignored `dist/`
      # (`tsconfig.test.json`, `noEmit: false`) and runs it with Node's built-in test
      # runner against real `generated/samples.ts` documents through a stubbed `fetch`
      # (`src/testing/fetch-stub.ts`) — never a hand-written stand-in.
      #
      # Both steps are expected GREEN. `int64.test.ts` was written to fail until chunk
      # B1 revived `Int64` in the runtime; B1a, B1b and B1c have all landed and it
      # passes locally, so a red `npm run test` on this runner is a real failure, not a
      # known-pending RED to be waited out. Do not "fix" this job by skipping or
      # loosening a test.
      #
      # The three things this block used to list as unconfirmed are now measured, on the
      # first runner execution (2026-08-29, run 33272881382): Node's module resolution,
      # the working directory `npm run test` resolves `dist/` relative to, and whether a
      # not-yet-existing `dist/` changes step ordering. All three are fine, and the last
      # one is fine BY CONSTRUCTION rather than by luck — `npm run test` is
      # `tsc -p tsconfig.test.json && … && node --test 'dist/**/*.test.js'`, so the step
      # builds `dist/` itself before anything reads it. No step here depends on state an
      # earlier step did not create.
      #
      # One hazard this job is still exposed to and cannot check: the runner's filesystem
      # is case-SENSITIVE and a developer's macOS checkout typically is not, so a
      # wrong-case relative import type-checks locally and fails only here. Audited
      # 2026-08-29 — 43 relative imports across 16 files, four distinct specifiers, each
      # resolving to an exact-case match. Re-audit if that ever reddens; `tsc` on a
      # case-insensitive filesystem cannot tell you.
      - run: npm run test
        working-directory: ts-fixture
